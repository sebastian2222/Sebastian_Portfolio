name: CI

# Quality gates only. Deployment is handled by Vercel's Git integration
# (production on master, preview deployments on pull requests).

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: vue-portfolio

jobs:
  verify:
    name: Lint, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: vue-portfolio/.nvmrc
          cache: npm
          cache-dependency-path: vue-portfolio/package-lock.json

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm audit --audit-level=high --omit=dev
      - run: npm run build
